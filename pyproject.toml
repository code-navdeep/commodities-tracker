[project]
name = "commodities-tracker"
version = "2.0.0"
description = "Multi-asset futures fundamentals dashboard: delivery, COT, prices, and options analytics over free official data sources"
requires-python = ">=3.13"
dependencies = [
    "pandas==3.0.3",
    "numpy==2.5.1",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "plotly==6.8.0",
    "dash==4.4.0",
    "curl_cffi==0.15.0",
    "pdfplumber==0.11.10",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "commodities",
    "commodities.sources",
    "commodities.analytics",
    "commodities.views",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
